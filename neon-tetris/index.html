<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>NEON TETRIS · 现代俄罗斯方块</title>
<style>
  :root{
    --cell: min(48px, 6.4vw);
    --bg0:#0a0a1a; --bg1:#140a2e; --neon:#00e5ff; --neon2:#ff2bd6; --neon3:#ffd60a;
    --panel:rgba(12,12,30,.72); --panel-border:rgba(120,220,255,.28);
    --txt:#e9f6ff; --txt-dim:#8ea3c0; --good:#6dff9b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #1a1240 0%, var(--bg1) 45%, var(--bg0) 100%);
    color:var(--txt); font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100%;
    overflow:hidden; user-select:none; touch-action:none;
  }
  #stage{display:flex; gap:18px; align-items:flex-start; padding:14px; position:relative;
    transform-origin:center; width:100%; max-width:1100px;}
  canvas{display:block; image-rendering:pixelated;}
  .boardWrap{position:relative;}
  #board{background:
      linear-gradient(180deg,#0b0b20,#0d0d26 60%,#09091a);}
  #board::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.35;}
  .panel{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
    padding:12px; backdrop-filter:blur(8px); box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .stat{font-size:12px; letter-spacing:2px; color:var(--txt-dim); text-transform:uppercase;}
  .stat b{display:block; font-size:26px; font-weight:800; color:#fff; text-shadow:0 0 14px rgba(0,229,255,.55); letter-spacing:1px; line-height:1.1;}
  .mini{display:flex; gap:12px; justify-content:space-between;}
  .mini .p2{width:74%;}
  .label{font-size:11px; letter-spacing:2px; color:var(--txt-dim); margin:6px 0 6px; text-transform:uppercase;}
  .big{font-size:30px; font-weight:900; letter-spacing:2px;}
  #comboWrap{min-height:34px; transition:transform .12s ease, opacity .2s;}
  #comboWrap.bump{transform:scale(1.18);}
  #comboText{font-size:22px; font-weight:800; color:var(--neon3); text-shadow:0 0 18px rgba(255,214,10,.6);}
  .hidden{display:none !important;}

  /* Overlay */
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(20,10,46,.85), rgba(6,6,18,.96));
    backdrop-filter:blur(6px); z-index:50; font-family:inherit;}
  #overlay .card{max-width:440px;width:calc(100% - 32px); background:var(--panel);
    border:1px solid var(--panel-border); border-radius:20px; padding:24px; box-shadow:0 20px 80px rgba(0,0,0,.6);}
  #overlay h1{margin:0 0 4px; font-size:30px; letter-spacing:3px;
    background:linear-gradient(90deg,#00e5ff,#ff2bd6,#ffd60a); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:900;}
  #overlay .sub{color:var(--txt-dim); font-size:13px; line-height:1.6; margin:10px 0 16px;}
  .keys{font-size:12.5px; color:#cfe6ff; line-height:1.9; margin:0 0 18px; padding:12px 14px;
    background:rgba(255,255,255,.04); border-radius:12px; border:1px solid rgba(120,220,255,.14);}
  .keys b{color:#fff;} .keys kbd{background:#1c2340;border:1px solid #33406b;border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-family:inherit;font-size:11px;color:#d6e8ff;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{background:#161a33;color:#c9d6ef;border:1px solid #2a345c;border-radius:10px;padding:7px 11px;font-size:12.5px;cursor:pointer;transition:.15s;}
  .seg button:hover{border-color:#3d6bff;} .seg button.active{color:#fff;border-color:var(--neon);box-shadow:0 0 12px rgba(0,229,255,.45);}
  .btn{background:linear-gradient(180deg,#12355c,#0c2a4a);color:#eaf8ff;border:1px solid #2b77b0;border-radius:12px;padding:11px 20px;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);transition:.15s;}
  .btn:hover{transform:translateY(-1px);} .btn:active{transform:translateY(1px);}
  .btn.sec{background:#1a1f3a;border-color:#33406b;color:#cfe0ff;font-size:13px;padding:8px 14px;}
  .toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:#cfe0ff;margin:6px 0;}
  .switch{position:relative;width:44px;height:24px;} .switch input{display:none;} .track{position:absolute;inset:0;background:#232a4d;border-radius:24px;transition:.2s;border:1px solid #3a4570;} .track:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:2px;background:#a9b6d6;border-radius:50%;transition:.2s;} input:checked+.track:before{transform:translateX(20px);background:#00e5ff;box-shadow:0 0 10px rgba(0,229,255,.7);}
  .close{position:absolute;top:12px;right:18px;background:none;border:none;color:#8ea3c0;font-size:22px;cursor:pointer;}
  .close:hover{color:#fff;}
  /* Touch controls */
  #touch{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;padding:12px 14px 18px;justify-content:space-between;align-items:flex-end;pointer-events:none;}
  #touch .pad,.touchActions{display:flex;gap:10px;pointer-events:auto;}
  .touchKey{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#eaf8ff;background:linear-gradient(180deg,#18305a,#0e2446);border:1px solid #2b5a92;box-shadow:0 6px 16px rgba(0,0,0,.45);}
  .touchKey.wide{width:78px;} .touchKey:active{background:linear-gradient(180deg,#2b6fbf,#1b4e8c);box-shadow:0 0 16px rgba(0,180,255,.6);}
  @media (hover:none) and (pointer:coarse){#touch{display:flex;} .desktopHint{display:none;}}
  @media (max-width:760px){
    :root{--cell: min(52px, 9vw);} .big{font-size:24px;} .btn{padding:10px 15px;font-size:14px;}
  }
  @media (max-width:560px){
    :root{--cell: min(60px, 13.2vw);} #stage{gap:10px;} .mini{gap:8px;}
  }
  .footer{position:fixed;top:6px;right:14px;font-size:11px;color:#5c6a90;letter-spacing:1px;}
  .pulse{animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
</style>
</head>
<body>
<div id="stage">
  <div class="panel">
    <div class="boardWrap">
      <canvas id="board" width="300" height="600"></canvas>
    </div>
  </div>

  <div style="flex:1; min-width:230px; display:flex; flex-direction:column; gap:12px;">
    <div class="panel">
      <div class="mini">
        <div class="stat">分数<br><b id="score">0</b></div>
        <div class="stat">等级<br><b id="level">1</b></div>
        <div class="stat">消行<br><b id="lines">0</b></div>
      </div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(120,220,255,.35),transparent);margin:10px 0;"></div>
      <div class="stat">最高分<br><b id="hi">0</b></div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(120,220,255,.35),transparent);margin:10px 0;"></div>
      <div class="stat">连击<br><b id="combo">—</b></div>
      <div id="comboWrap"><div class="mini"><div><span class="stat" style="margin:0">状态</span><b id="status" style="font-size:18px;color:#6dff9b">READY</b></div></div></div>
    </div>

    <div class="panel">
      <div class="stat">下一个</div>
      <div class="seg" id="next" style="gap:10px;justify-content:center;"></div>
    </div>

    <div class="panel">
      <div class="stat">持有</div>
      <div class="seg" id="hold" style="gap:10px;justify-content:center;"></div>
    </div>

    <div class="panel" style="padding:10px;">
      <div class="stat">随机器</div>
      <div class="seg" id="genSeg" style="gap:6px;justify-content:center;">
        <button data-gen="7bag" class="active">7-Bag (SRS)</button>
        <button data-gen="4bag">4-Bag</button>
        <button data-gen="classic">Classic</button>
        <button data-gen="9bag">Random9G</button>
      </div>
      <div style="margin-top:10px;">
        <div class="toggle"><span>锁定时</span><span id="lockLabel" style="color:#8ea3c0">0.5s</span><label class="switch"><input type="checkbox" id="lockToggle"><span class="track"></span></label></div>
        <div class="seg" id="dasySeg" style="gap:6px;justify-content:flex-start;">
          <button data-das="normal" class="active">DAS 标准</button>
          <button data-das="fast">DAS 快</button>
          <button data-das="off">DAS 关</button>
        </div>
      </div>
    </div>

    <div class="row" style="justify-content:center; margin-top:4px;">
      <button class="btn" id="pauseBtn">暂停</button>
      <button class="btn" id="startBtn">开始 / 重新开始</button>
      <button class="btn sec" id="soundBtn">静音</button>
      <button class="btn sec" id="helpBtn">帮助</button>
    </div>
  </div>
</div>

<div id="touch">
  <div></div>
  <div class="touchActions">
    <div class="touchKey" data-act="rotate">⟲</div>
    <div class="touchKey" data-act="soft">↓</div>
    <div class="touchKey wide" data-act="hard">⤓</div>
    <div class="touchKey" data-act="hold">Hold</div>
    <div class="touchKey" data-act="rotateCw">⟳</div>
  </div>
  <div class="pad">
    <div class="touchKey" data-act="left">◀</div>
    <div class="touchKey" data-act="rotateCw2">⟲</div>
    <div class="touchKey" data-act="right">▶</div>
  </div>
</div>

<div class="footer">v1.0 · SRS · 7-bag · Web Audio</div>

<div id="overlay">
  <div class="card" id="card">
    <button class="close hidden" id="closeCard">✕</button>
    <h1 id="ovTitle">NEON TETRIS</h1>
    <p class="sub" id="ovText"></p>
    <div id="ovBody"></div>
  </div>
</div>

<script>
"use strict";
(function(){
  /* ============================================================
     NEON TETRIS — 现代俄罗斯方块
     特性：SRS 旋转 + 墙踢 · 7-bag / 4-bag / classic / random9g
     · Hold · Next×4 · Ghost · DAS/ARR · Lock Delay
     · T-Spin / Perfect Clear / Combo 计分 · 分级重力
     · 霓虹视觉 / 粒子特效 / 屏幕震动 / 程序化音效与配乐
     ============================================================ */

  // ---------- 配置 ----------
  const W = 10, H = 20;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const CELL = canvas.width / W;               // 30 逻辑像素
  const COLORS = {
    I:'#39c5ff', J:'#ff2bd6', L:'#ffb84d', O:'#ffd60a',
    S:'#6dff9b', T:'#b980ff', Z:'#ff5e78'
  };
  const PIECES = ['I','J','L','O','S','T','Z'];

  // ---------- 方块数据：每个方块定义 state0 形状与旋转中心 ----------
  // 坐标：x 向右，y 向下。形状用局部坐标。center 为旋转中心（固定点）。
  const SHAPE = {
    I:{center:{x:1.5,y:1.5}, cells:[[0,1],[1,1],[2,1],[3,1]]},
    J:{center:{x:0,y:1},   cells:[[2,1],[1,1],[0,1],[0,0]]},
    L:{center:{x:2,y:1},   cells:[[2,1],[1,1],[0,1],[2,0]]},
    O:{center:{x:1.5,y:1.5},cells:[[0,0],[1,0],[0,1],[1,1]]},
    S:{center:{x:2,y:1},   cells:[[2,0],[1,1],[2,1],[3,1]]},
    T:{center:{x:1,y:1},   cells:[[0,0],[1,0],[2,0],[1,1]]},
    Z:{center:{x:1,y:0},   cells:[[0,0],[1,0],[1,1],[2,1]]}
  };

  // 旋转工具
  function rotCW(cell,c){ const x=cell[0],y=cell[1]; return [c.x+(y-c.y), c.y-(x-c.x)]; }
  function rotCWcells(cells,c){ return cells.map(cell=>rotCW(cell,c)); }
  function rotCCWcells(cells,c){ return cells.map(cell=>rotCW(rotCW(rotCW(rotCW(cell,c),c),c),c)); }

  // 预计算每个方块 4 个旋转状态
  const PIECE_STATES = {};
  for(const name in SHAPE){
    const s = SHAPE[name]; const c=s.center;
    const st0=s.cells, st1=rotCWcells(st0,c), st2=rotCWcells(st1,c), st3=rotCWcells(st2,c);
    PIECE_STATES[name] = [st0,st1,st2,st3].map(a=>a.map(([x,y])=>[x,y]));
  }

  // ---------- SRS 墙踢表（y 向下：y+ 向下）----------
  // 每个方块 state -> { cw:[5个], ccw:[5个] }
  const KICKS = {
    O:{0:{cw:[[0,0]],ccw:[[0,0]]},1:{cw:[[0,0]],ccw:[[0,0]]},2:{cw:[[0,0]],ccw:[[0,0]]},3:{cw:[[0,0]],ccw:[[0,0]]}},
    J:{0:{cw:[[-1,0],[-1,-1],[0,2],[-1,2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]},
       1:{cw:[[1,0],[1,-1],[0,-2],[1,-2]],ccw:[[-1,0],[-1,1],[0,2],[-1,-2]]},
       2:{cw:[[1,0],[1,1],[0,-2],[1,2]],ccw:[[-1,0],[-1,-1],[0,2],[-1,2]]},
       3:{cw:[[-1,0],[-1,-1],[0,2],[-1,-2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]}},
    L:{0:{cw:[[-1,0],[-1,-1],[0,2],[-1,2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]},
       1:{cw:[[1,0],[1,-1],[0,-2],[1,-2]],ccw:[[-1,0],[-1,1],[0,2],[-1,-2]]},
       2:{cw:[[1,0],[1,1],[0,-2],[1,2]],ccw:[[-1,0],[-1,-1],[0,2],[-1,2]]},
       3:{cw:[[-1,0],[-1,-1],[0,2],[-1,-2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]}},
    S:{0:{cw:[[1,0],[1,-1],[0,-2],[1,-2]],ccw:[[-1,0],[-1,1],[0,2],[-1,-2]]},
       1:{cw:[[-1,0],[-1,-1],[0,2],[-1,-2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]},
       2:{cw:[[-1,0],[-1,-1],[0,2],[-1,-2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]},
       3:{cw:[[1,0],[1,1],[0,-2],[1,2]],ccw:[[-1,0],[-1,-1],[0,2],[-1,2]]}},
    T:{0:{cw:[[-1,0],[-1,-1],[0,2],[-1,2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]},
       1:{cw:[[1,0],[1,-1],[0,-2],[1,-2]],ccw:[[-1,0],[-1,1],[0,2],[-1,-2]]},
       2:{cw:[[1,0],[1,1],[0,-2],[1,2]],ccw:[[-1,0],[-1,-1],[0,2],[-1,2]]},
       3:{cw:[[-1,0],[-1,-1],[0,2],[-1,-2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]}},
    Z:{0:{cw:[[1,0],[1,-1],[0,-2],[1,-2]],ccw:[[-1,0],[-1,1],[0,2],[-1,-2]]},
       1:{cw:[[-1,0],[-1,-1],[0,2],[-1,-2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]},
       2:{cw:[[1,0],[1,1],[0,-2],[1,2]],ccw:[[-1,0],[-1,-1],[0,2],[-1,2]]},
       3:{cw:[[-1,0],[-1,-1],[0,2],[-1,-2]],ccw:[[1,0],[1,-1],[0,-2],[1,-2]]}},
    I:{0:{cw:[[-2,0],[1,0],[-2,1],[1,-2]],ccw:[[2,0],[-1,0],[2,-1],[-1,2]]},
       1:{cw:[[2,0],[-1,0],[2,-1],[-1,2]],ccw:[[-2,0],[1,0],[-2,1],[1,-2]]},
       2:{cw:[[-1,0],[2,0],[-1,-2],[2,1]],ccw:[[1,0],[-2,0],[1,2],[-2,-1]]},
       3:{cw:[[1,0],[-2,0],[1,2],[-2,-1]],ccw:[[-1,0],[2,0],[-1,-2],[2,1]]}}
  };

  // ---------- 随机器 ----------
  function makeRandomizer(kind){
    let pool, next;
    if(kind==='7bag'){
      const seq=[...PIECES];
      let refill(){ seq=[...PIECES]; fisherYates(seq,Math.random); };
      refill();
      return ()=>{ if(seq.length===0) refill(); return seq.shift(); };
    }
    if(kind==='4bag'){
      const seq=[...PIECES];
      let refill(){ seq=[...PIECES].slice(0,4); fisherYates(seq,Math.random); };
      refill();
      return ()=>{ if(seq.length===0) refill(); return seq.shift(); };
    }
    if(kind==='9bag'){
      const seq=[...PIECES];
      let refill(){ seq=[...PIECES]; seq.push('T','L','J'); fisherYates(seq,Math.random); };
      refill();
      return ()=>{ if(seq.length===0) refill(); return seq.shift(); };
    }
    // classic
    return ()=> PIECES[Math.floor(Math.random()*7)];
  }
  function fisherYates(a,r){ for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

  // ---------- 计分 / 重力 ----------
  const GRAVITY_MS = [800,720,660,600,550,500,450,400,350,300,270,240,210,190,170,155,140,130,120,110,100];
  function gravity(level){ return GRAVITY_MS[Math.min(level,20)]; }
  // DAS
  const DAS = { normal:{delay:160,interval:45}, fast:{delay:110,interval:35}, off:{delay:1e9,interval:1e9} };

  // ---------- 音效引擎（Web Audio 程序化）----------
  const Audio = {
    ctx:null, master:null, musicGain:null, sfxGain:null, muted:false,
    ensure(){
      if(this.ctx) return this.ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value=0.9; this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value=0.9; this.sfxGain.connect(this.master);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value=0.5; this.musicGain.connect(this.master);
      return this.ctx;
    },
    tone(freq, dur, type, gain, delay, dest, slide){
      const c=this.ctx; if(!c||this.muted) return;
      const t=c.currentTime+delay;
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(gain||0.2,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(dest||this.sfxGain); o.start(t); o.stop(t+dur+0.02);
    },
    noise(dur, gain, delay, dest, filterFreq){
      const c=this.ctx; if(!c||this.muted) return;
      const t=c.currentTime+delay;
      const buf=c.createBuffer(1, Math.max(1,c.sampleRate*dur), c.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const src=c.createBufferSource(); src.buffer=buf;
      const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=filterFreq||800;
      const g=c.createGain(); g.gain.setValueAtTime(gain||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(f); f.connect(g); g.connect(dest||this.sfxGain); src.start(t);
    },
    place(name){ this.tone(320+ (PIECES.indexOf(name)%7)*30, 0.08, 'triangle', 0.16); },
    soft(){ this.tone(440,0.06,'sine',0.09); },
    hard(){ this.noise(0.14,0.22,'hard'); this.tone(120,0.12,'sine',0.14,0.02); },
    move(){ this.tone(520,0.045,'square',0.05); },
    rotate(){ this.tone(660,0.07,'square',0.06); this.tone(880,0.05,'sine',0.05,0.02); },
    hold(){ this.tone(500,0.09,'triangle',0.1); },
    lock(){ this.tone(180,0.08,'triangle',0.07); },
    line(n){
      // n=1..4
      const pts=[[523.25,587.33],[659.25,783.99],[783.99,987.77],[987.77,1174.66,1318.51]];
      let notes = pts[n-1]||pts[3];
      notes.forEach((f,i)=>this.tone(f, 0.12+n*0.02, 'triangle', 0.14, i*0.02));
      if(n===4){ // 四消：额外的闪耀和弦
        [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,0.25,'sine',0.1, i*0.03, this.sfxGain));
      }
    },
    tspin(single){
      // single/double/triple
      const maps={1:[659.25,783.99,987.77],2:[783.99,987.77,1174.66],3:[987.77,1174.66,1567.98]};
      const notes=maps[single]||maps[3];
      notes.forEach((f,i)=>this.tone(f,0.16,'square',0.12,i*0.015));
    },
    levelUp(){
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,0.3,'triangle',0.12,i*0.04));
      this.tone(131.81,0.5,'sine',0.1,0.1);
    },
    gameover(){
      [440,415.3,392,370,350].forEach((f,i)=>this.tone(f,0.4,'sawtooth',0.12,i*0.09));
      this.tone(90,0.8,'sine',0.12,0.5);
    },
    pause(){ this.tone(330,0.15,'sine',0.08); },
    tap(){ this.tone(700,0.05,'square',0.06); },
    perfect(){ [880,1108.73].forEach((f,i)=>this.tone(f,0.16,'triangle',0.11,i*0.03)); },
    // --- 配乐：用 requestAnimationFrame 节拍器，tempo 跟随游戏速度 ---
    startMusic(){
      const c=this.ensure(); if(!c) return;
      if(this._music) return;
      const notes=[330,392.0,440,523.25,392.0,369.99,330,293.66];
      const bass=[65.41,55,65.41,73.42,65.41,58.27,65.41,82.4];
      const BPM=100; const step=60000/BPM/2; // 8分音符
      let started=false, last=0, stepIdx=0;
      const play = ()=>{
        if(!this.ctx||G.gameOver) return;
        const now=performance.now();
        if(started && now-last>step){
          last=now;
          const n=notes[stepIdx%notes.length];
          this.tone(n*2,0.22,'sine',0.07,0,Audio.musicGain);
          this.tone(n,0.34,'triangle',0.04,0.01,Audio.musicGain);
          if(stepIdx%4===0) this.tone(55,0.45,'sawtooth',0.045,0,Audio.musicGain);
          stepIdx++;
        }
        requestAnimationFrame(play);
      };
      play();
      this._music=setInterval(()=>{ if(!this.ctx||G.gameOver) return; /* keep ref alive */ }, 60);
    },
    stopMusic(){
      if(this._music){ clearInterval(this._music); this._music=null; }
      if(this.ctx){ try{ this.musicGain.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.6);}catch(e){} }
    }
  };

  // ---------- 游戏核心 ----------
  const G = {
    board:null, queue:[], current:null, hold:null, holdLocked:false,
    score:0, lines:0, level:1, hi:0, combo:0, status:'READY', tspin:null,
    shake:0, particles:[], clearing:null, levelUpAnim:0,
    running:false, paused:false, gameOver:false, das:{key:{},timer:{}},
    lockAcc:0, spawnQueue:[], gen:'7bag', dasType:'normal',
    lockDelay:500, tspinTimer:0, acc:0, lastTime:0
  };

  const boardEl = document.getElementById('board');
  function emptyBoard(){ return Array.from({length:H},()=>Array(W).fill(0)); }

  function addQueue(){
    while(G.queue.length<4){
      const kind=G.gen;
      if(kind==='4bag'){ let s=[...PIECES]; fisherYates(s,Math.random); G.queue.push(s.shift()); if(s.length===0){s=[...PIECES].slice(0,4); fisherYates(s,Math.random);} }
      else if(kind==='7bag'){ const s=[...PIECES]; fisherYates(s,Math.random); for(let i=0;i<7;i++) G.queue.push(s.shift()); }
      else if(kind==='9bag'){ const s=[...PIECES]; s.push('T','L','J'); fisherYates(s,Math.random); for(let i=0;i<9;i++) G.queue.push(s.shift()); }
      else { G.queue.push(PIECES[Math.floor(Math.random()*7)]); }
    }
  }

  function spawnPiece(){
    const name=G.queue.shift(); addQueue();
    const s=SHAPE[name]; const st=PIECE_STATES[name][0];
    const bw = Math.max(...st.map(c=>c[0]));
    const spawn = {
      name, type:name, rot:0,
      x: Math.floor((W - bw)/2),
      y: -Math.max(...st.map(c=>c[1])),
      st: st.map(c=>[...c])
    };
    G.current = spawn; G.holdLocked=false;
    setStatus('PLAY');
  }

  function collides(piece, dx, dy, rot, cells){
    const c = PIECE_STATES[piece.name][rot];
    for(const [x,y] of c){
      const bx=piece.x+dx+x, by=piece.y+dy+y;
      if(bx<0||bx>=W||by>=H) return true;
      if(by>=0 && G.board[by][bx]) return true;
    }
    return false;
  }
  function clearCells(piece, dx, dy, rot){
    const c = PIECE_STATES[piece.name][rot];
    const set=new Set();
    for(const [x,y] of c){ const bx=piece.x+dx+x, by=piece.y+dy+y; if(bx>=0&&bx<W&&by>=0) set.add(bx+','+by); }
    return set;
  }

  function move(dx,dy){
    if(!G.current) return;
    if(!collides(G.current, dx, dy, G.current.rot, G.current.st)) applyMove(dx,dy);
  }
  function applyMove(dx,dy){
    const p=G.current;
    if(!collides(p,dx,dy,p.rot,p.st)){ p.x+=dx; p.y+=dy; return true;}
    return false;
  }

  function tryRotate(dir){
    if(!G.current || G.current.name==='O') return;
    const p=G.current; const to=(p.rot+dir+4)%4;
    const base=PIECE_STATES[p.name][p.rot];
    const rotated = dir>0 ? base.map(c=>rotCW([...c],SHAPE[p.name].center)) : base.map(c=>rotCCW([...c],SHAPE[p.name].center));
    const kicks = KICKS[p.name][p.rot][dir>0?'cw':'ccw'];
    for(const [kx,ky] of kicks){
      const cand = rotated.map(c=>[c[0]+kx, c[1]+ky]);
      const p2 = {x:p.x, y:p.y, rot:to, st:cand};
      if(!collides(p2,0,0,to,cand)){
        p.rot=to; p.st=cand.map(c=>[...c]);
        Audio.rotate(); shake=3; return true;
      }
    }
    return false;
  }

  function hardDrop(){
    if(!G.current) return;
    let dist=0;
    while(!collides(G.current,0,1,G.current.rot,G.current.st)){ G.current.y++; dist++; }
    G.current.y--; dist--;
    GhostY();
    lockPiece();
    G.score += dist*2; updateHud();
  }
  function softDrop(){
    if(!G.current) return;
    if(!collides(G.current,0,1,G.current.rot,G.current.st)){ G.current.y++; Audio.soft(); G.score++; updateHud(); return true;}
    return false;
  }
  function GhostY(){
    if(!G.current) return;
    let dy=0; while(!collides(G.current,0,dy, G.current.rot, G.current.st)) dy++;
    G.ghostY = G.current.y+dy;
  }
  function lockPiece(){
    if(!G.current) return;
    const p=G.current;
    Audio.lock();
    const cells=clearCells(p,0,0,p.rot);
    for(const key of cells){ const [x,y]=key.split(',').map(Number); G.board[y][x]=p.name;}
    detectTSpin(p);
    const n = countLines();
    if(n>0){
      doClear(n, cells);
    } else {
      G.combo=0; updateHud();
    }
    G.current=null; G.ghostY=0;
    spawnPiece();
  }

  function doClear(n, cells){
    G.lines += n;
    const perfect = [];
    for(const key of cells){ const [x,y]=key.split(',').map(Number); if(y>=H-1){const row=G.board[y]; if(row.every(v=>!!v)) perfect.push(y);} }
    G.combo++;
    const comboBonus = G.combo>1 ? G.combo*50 : 0;
    let pts;
    if(n===1) pts=100; else if(n===2) pts=300; else if(n===3) pts=500; else pts=800;
    pts = pts*G.level + comboBonus;
    for(const y of perfect) pts += 10*G.level;
    G.score += pts;

    Audio.line(n);
    for(const key of cells){ const [x,y]=key.split(',').map(Number); spawnClearParticles(x,y,n); }
    G.clearing = {rows:rowsToClear(n), timer:0, perfect:perfect.length>0};
    G.shake = Math.min(14, 6 + n*3);
    if(n===4){ shake=22; }
    if(G.combo>1){ comboBump(); }
    const newLevel = 1 + Math.floor(G.lines/10);
    if(newLevel>G.level){
      G.level=newLevel;
      G.acc=0;
      Audio.levelUp();
      G.levelUpAnim=30;
      levelUpEffect();
    }
    if(G.score>G.hi){ G.hi=G.score; saveHi(); }
    updateHud();
  }

  function rowsToClear(n){ const r=H-n; return Array.from({length:n},()=>true); }

  function detectTSpin(p){
    if(p.name!=='T' || p.rot!==0) return;
    const sx=p.x+1, sy=p.y+1;
    if(sy>=H) return;
    const belowEmpty = !G.board[sy+1][sx];
    if(!belowEmpty) return;
    const corners=[ [sx-1,sy],[sx+1,sy],[sx,sy+1] ];
    let empty=0;
    for(const [x,y] of corners){ if(x<0||x>=W||y<0||y>=H||!G.board[y][x]) empty++; }
    if(empty>=1){
      const until = performance.now()+1200;
      G.tspin = {level:empty, until, sx, sy, rot:0};
    }
  }
  function isTspinNow(){ return G.tspin && performance.now()<G.tspin.until; }

  function countLines(){
    const full=[];
    for(let y=H-1;y>=0;y--){ if(G.board[y].every(v=>v)) full.push(y); }
    return full.length;
  }

  // ---------- 特效 ----------
  function spawnClearParticles(x,y,n){
    const nParts = 6 + n*2;
    for(let i=0;i<nParts;i++){
      G.particles.push({x:x*CELL+CELL/2, y:y*CELL+CELL/2,
        vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-2,
        life:1, max:0.7+n*0.05, size:CELL*0.14+Math.random()*CELL*0.12,
        color: n===4 ? COLORS['O'] : COLORS[PIECES[Math.floor(Math.random()*7)]], glow: true});
    }
  }
  function comboBump(){ const el=document.getElementById('comboWrap'); el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),140); }
  function levelUpEffect(){
    G.particles.push({boom:true, t:0, max:1, color:'#ffffff'});
  }

  // ---------- 主循环 ----------
  function loop(now){
    requestAnimationFrame(loop);
    const dt = G.lastTime ? Math.min(now-G.lastTime, 100) : 16; G.lastTime=now;
    if(!G.paused && !G.gameOver && G.current){
      G.acc += dt;
      const grav=gravity(G.level);
      while(G.acc>=grav){ G.acc-=grav; G.dropTick(); }
      G.lockAcc += dt;
      if(G.tspin){ if(now>G.tspin.until) G.tspin=null; }
    }
    render(now);
  }

  function dropTick(){
    if(!G.current) return;
    if(collides(G.current,0,1,G.current.rot,G.current.st)){
      if(G.lockDelay===0 || G.lockAcc>=G.lockDelay){ lockPiece(); }
    } else {
      G.current.y++;
    }
    if(G.lockDelay===0){ G.lockAcc=0; }
  }

  // ---------- 渲染 ----------
  function render(now){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.save();
    if(G.shake>0){
      const s=G.shake; G.shake*=0.86; if(G.shake<0.3) G.shake=0;
      ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    }
    drawBoardBg();
    drawWell();
    if(G.clearing){ drawClearAnim(); }
    if(!G.gameOver){ drawGhost(); drawBoard(); }
    if(G.current) drawPiece(G.current);
    drawParticles();
    ctx.restore();
  }

  function drawWell(){
    ctx.strokeStyle='rgba(90,150,220,0.10)'; ctx.lineWidth=1;
    for(let x=0;x<=W;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H*CELL); ctx.stroke(); }
    for(let y=0;y<=H;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W*CELL,y*CELL); ctx.stroke(); }
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      if(G.board[y][x]) drawCell(x,y,G.board[y][x]);
    }
    ctx.strokeStyle='rgba(0,229,255,0.5)'; ctx.lineWidth=2;
    ctx.strokeRect(1,1,W*CELL-2,H*CELL-2);
  }

  function drawCell(x,y,name){
    const cx=x*CELL, cy=y*CELL, s=CELL;
    const col=COLORS[name]||'#39c5ff';
    const g=ctx.createLinearGradient(cx,cy,cx,cy+s);
    g.addColorStop(0, lighten(col,40)); g.addColorStop(1, col);
    ctx.fillStyle=g;
    roundRect(cx+1,cy+1,s-2,s-2,5); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.28)';
    roundRect(cx+1,cy+1,s-2,(s-2)*0.35,4); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.28)';
    roundRect(cx+s*0.55,cy+s*0.55,s-2,s-2,5); ctx.fill();
    ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=10;
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1;
    roundRect(cx+1,cy+1,s-2,s-2,5); ctx.stroke();
    ctx.restore();
  }

  function drawPiece(p){
    const st=p.st, rot=p.rot;
    for(const [cx,cy] of st){
      const x=p.x+cx, y=p.y+cy;
      if(x<0||x>=W||y<0) continue; if(y>=H) continue;
      drawCell(x,y,p.name);
    }
  }

  function drawGhost(){
    if(!G.current) return;
    const st=G.current.st, rot=G.current.rot;
    let dy=0; while(!collides(G.current,0,dy,rot,st)) dy++;
    for(const [cx,cy] of st){
      const x=G.current.x+cx, y=G.current.y+dy+cy;
      if(x<0||x>=W||y<0||y>=H) continue;
      const col=COLORS[G.current.name];
      ctx.strokeStyle=col; ctx.globalAlpha=0.35; ctx.lineWidth=2;
      ctx.fillStyle=col; ctx.globalAlpha=0.10;
      roundRect(x*CELL+2,y*CELL+2,CELL-4,CELL-4,5); ctx.fill();
      ctx.globalAlpha=1; ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  function drawParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
      const pt=G.particles[i];
      if(pt.boom){ pt.t+=1/60; if(pt.t>=pt.max) G.particles.splice(i,1); continue; }
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.25; pt.life-=1/60*0.7;
      if(pt.life<=0){ G.particles.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha=Math.max(0,pt.life);
      ctx.shadowColor=pt.color; ctx.shadowBlur=12;
      ctx.fillStyle=pt.color;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,Math.max(1.5,pt.size*Math.max(0.15,pt.life)),0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function drawClearAnim(){
    if(!G.clearing) return;
    G.clearing.timer += 1/60;
    const t=G.clearing.timer;
    const rows=G.clearing.rows, r=rows.length;
    if(t<0.18){
      for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){
          if(rows.indexOf(y)!==-1 && y>=rows[rows.length-1]){
            ctx.fillStyle='rgba(255,255,255,'+(0.7*Math.sin((t/0.18)*Math.PI))+')';
            ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
          }
        }
      }
    }
    const clearRow = rows[rows.length-1];
    const speed = 3*CELL;
    let wy = clearRow*CELL;
    if(t>0.18){
      const prog = Math.min(1,(t-0.18)/(0.5-r*0.06));
      wy = clearRow*CELL - prog*speed*(H-clearRow);
      const grad=ctx.createLinearGradient(0,wy,0,wy+2);
      grad.addColorStop(0,'rgba(0,229,255,0.9)'); grad.addColorStop(1,'rgba(255,43,210,0)');
      ctx.fillStyle=grad; ctx.fillRect(0,wy,W,2);
    }
    if(G.particles.some(p=>p.boom)){
      const b=G.particles.find(p=>p.boom);
      ctx.globalAlpha=1-b.t/b.max*0.6;
      ctx.fillStyle='rgba(255,255,255,'+Math.max(0,1-b.t/b.max)+')';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.globalAlpha=1;
    }
    if(t>0.45){ G.clearing=null; G.board=emptyBoard(); updateHud(); }
  }

  function drawBoardBg(){
    const g=ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,'#0a1226'); g.addColorStop(1,'#05050f');
    ctx.fillStyle=g; ctx.fillRect(-40,-40,canvas.width+80,canvas.height+80);
    ctx.save(); ctx.globalAlpha=0.4;
    for(let i=0;i<40;i++){
      const sx=(i*137.5)%canvas.width;
      const sy=(i*97.3 + (performance.now()/120)%canvas.height);
      ctx.fillStyle=`hsl(${(i*40)%360},80%,70%)`;
      ctx.fillRect(sx, sy%canvas.height, 1.5,1.5);
    }
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function lighten(hex,amt){
    let c=hex.replace('#','');
    const num=parseInt(c,16); let r=(1<<24)|(num+amt); r=r&0xffffff;
    return 'rgb('+((r>>16)&255)+','+((r>>8)&255)+','+(r&255+')';
  }

  function updateHud(){
    document.getElementById('score').textContent=G.score;
    document.getElementById('level').textContent=G.level;
    document.getElementById('lines').textContent=G.lines;
    document.getElementById('hi').textContent=G.hi;
    const c=document.getElementById('combo');
    if(G.combo>1) c.textContent=G.combo+'x'; else c.textContent='—';
    renderMini(); renderNext(); renderHold();
  }
  function renderMini(){
    document.getElementById('status').textContent = G.paused?'PAUSED': G.gameOver?'GAME OVER':'READY';
  }
  function renderNext(){
    const el=document.getElementById('next'); el.innerHTML='';
    for(let i=0;i<4;i++){
      const d=document.createElement('div'); d.style.cssText='width:'+CELL*2+'px;height:'+CELL*3.2+'px;position:relative;';
      if(G.queue[i]){ drawPreview(d,G.queue[i],CELL*0.72); }
      else { d.style.border='1px dashed rgba(120,220,255,.2)'; }
      el.appendChild(d);
    }
  }
  function renderHold(){
    const el=document.getElementById('hold'); el.innerHTML='';
    if(G.hold){ const d=document.createElement('div'); d.style.cssText='width:'+CELL*2+'px;height:'+CELL*3.2+'px;position:relative;'; drawPreview(d,G.hold,CELL*0.72); el.appendChild(d);}
    else { el.innerHTML='<span style="color:#5c6a90;font-size:12px;">无</span>'; }
  }
  function drawPreview(root,name,size){
    const s=PIECE_STATES[name][0]; const bw=Math.max(...s.map(c=>c[0]))+1;
    const bh=Math.max(...s.map(c=>c[1]))+1;
    const ox=(size*bw-size)/2, oy=(size*bh-size)/2;
    for(const [x,y] of s){ const cx=ox+x*size, cy=oy+y*size;
      const col=COLORS[name];
      const g=ctx.createLinearGradient(cx,cy,cx,cy+size);
      g.addColorStop(0,lighten(col,30)); g.addColorStop(1,col);
      ctx.fillStyle=g; roundRect(cx+1,cy+1,size-2,size-2,4); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.25)'; roundRect(cx+1,cy+1,size-2,(size-2)*0.35,3); ctx.fill();
    }
  }

  // ---------- 输入 ----------
  const KEYMAP = {
    'ArrowLeft':'left','ArrowRight':'right','ArrowDown':'down','ArrowUp':'rotateCw',
    'z':'rotateCw','a':'left','d':'right','s':'down','x':'rotateCw','Z':'rotateCw','A':'left','D':'right','S':'down','X':'rotateCw','W':'rotateCw',' ':'hard'
  };
  window.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    if(G.gameOver && (e.key==='r'||e.key==='R'||e.key==='Enter')){ newGame(); return; }
    const action = KEYMAP[e.key]; if(!action) return;
    if(G.paused) return;
    if(action==='left'||action==='right'||action==='down'){ e.stopPropagation(); dasRepeat(action); }
    else if(action==='rotateCw') tryRotate(1);
    else if(action==='soft'){ softDrop(); e.stopPropagation(); }
    else if(action==='hard'){ hardDrop(); e.stopPropagation(); }
    else if(action==='hold'){ doHold(); }
  });
  function dasRepeat(action){
    if(G.das.key[action]) return;
    G.das.key[action]=true;
    const cfg=DAS[G.dasType]; if(cfg.delay>=1e9) return;
    G.das.timer[action]=setTimeout(()=>{
      const iv=setInterval(()=>{
        if(!G.das.key[action]){ clearInterval(G.das.timer[action]); return; }
        if(G.running && !G.paused && G.current){
          if(action==='down') softDrop(); else move(action==='left'?-1:1);
        }
      },cfg.interval);
      G.das.timer[action]=iv;
    },cfg.delay);
  }
  window.addEventListener('keyup',e=>{
    const action=KEYMAP[e.key]; if(!action||!G.das.key[action]) return;
    G.das.key[action]=false; if(G.das.timer[action]){ clearInterval(G.das.timer[action]); G.das.timer[action]=null; }
  });

  function doHold(){
    if(!G.current) return;
    if(G.holdLocked) return;
    const cur=G.current.name;
    if(G.hold!==null){ G.current=null; G.ghostY=0; spawnFromHold(); }
    else { G.hold=cur; G.holdLocked=true; }
    Audio.hold(); updateHud();
  }
  function spawnFromHold(){
    const name=G.hold; G.hold=null; G.holdLocked=true;
    G.current={name,rot:0,x:0,y:0,st:PIECE_STATES[name][0]}; G.ghostY=0;
    updateHud();
  }

  // ---------- 触摸控制 ----------
  const touchMap={left:-1,right:1,rotate:1,rotateCw:1,rotateCw2:1,soft:'soft',hard:'hard',hold:'hold'};
  document.querySelectorAll('#touch .touchKey').forEach(k=>{
    const act=k.getAttribute('data-act');
    k.addEventListener('touchstart',e=>{e.preventDefault(); if(G.paused)return;
      if(act==='left')move(-1); else if(act==='right')move(1); else if(act==='soft')softDrop(); else if(act==='hard')hardDrop(); else if(act==='rotateCw')tryRotate(1); else if(act==='rotate')tryRotate(1); else if(act==='hold')doHold();
    },passive:false);
    k.addEventListener('mousedown',e=>{ if(G.paused)return; if(act==='left')move(-1); else if(act==='right')move(1); });
  });
  let ttx=0,tty=0,touchMoved=false;
  window.addEventListener('touchstart',e=>{ if(!G.current) return; const t=e.touches[0]; ttx=t.clientX; tty=t.clientY; touchMoved=false;},{passive:true});
  window.addEventListener('touchmove',e=>{ if(!G.current)return; const t=e.touches[0]; if(Math.abs(t.clientX-ttx)>22||Math.abs(t.clientY-tty)>22) touchMoved=true;},{passive:true});
  window.addEventListener('touchend',e=>{
    if(!G.current) return; const t=e.changedTouches[0]; const dx=t.clientX-ttx, dy=t.clientY-tty;
    if(!touchMoved && Math.abs(dx)<22 && Math.abs(dy)<22) return;
    if(Math.abs(dx)>Math.abs(dy)){ if(dx>30) move(1); else if(dx<-30) move(-1); }
    else { if(dy>30) softDrop(); else tryRotate(1); }
  },{passive:true});

  // ---------- 游戏流程 ----------
  function newGame(){
    G.board=emptyBoard(); G.queue=[];
    while(G.queue.length<4) addQueue();
    G.score=0; G.lines=0; G.level=1; G.combo=0;
    G.hold=null; G.holdLocked=false; G.current=null; G.ghostY=0;
    G.tspin=null; G.particles=[]; G.clearing=null; G.shake=0;
    G.lockAcc=0; G.acc=0; G.das={key:{},timer:{}};
    G.gameOver=false; G.paused=false; G.running=true;
    Audio.ensure(); Audio._music=null; Audio._musicRef=null;
    Audio._start();
    spawnPiece(); updateHud();
    setStatus('PLAY');
    showOverlay('NEON TETRIS','用方向键 / WASD 操控，Z/X 或↑旋转。享受现代 SRS + 7-bag 带来的极致体验。',
      btn('开始游戏','start','btn');
    document.getElementById('overlay').classList.remove('hidden');
    setTimeout(()=>document.getElementById('overlay').classList.add('hidden'),500);
  }
  function setStatus(s){ if(s==='PLAY') document.getElementById('status').textContent='PLAY';
    if(s==='PAUSE') document.getElementById('status').textContent='PAUSED';
    if(s==='GAME OVER') document.getElementById('status').textContent='GAME OVER'; }

  function pause(){ if(!G.running||G.paused||G.gameOver) return; G.paused=true; setStatus('PAUSE'); Audio.pause();
    showOverlay('暂停','按 P 或按钮继续。',btn('继续','resume','btn'));
    document.getElementById('overlay').classList.remove('hidden'); }
  function resume(){ if(G.paused){ G.paused=false; setStatus('PLAY'); Audio.resume(); hideOverlay(); } }
  function triggerGameOver(){
    G.gameOver=true; G.running=false; G.current=null; G.paused=false;
    Audio.gameover();
    document.getElementById('hi').textContent=G.hi;
    showOverlay('GAME OVER','最终得分 '+G.score+'',
      btn('再来一局','restart','btn');
    document.getElementById('overlay').classList.remove('hidden');
  }

  document.addEventListener('keydown',e=>{ if(e.key==='p'||e.key==='P'){ if(G.running){ if(G.paused) resume(); else pause(); } }});

  // ---------- UI 绑定 ----------
  document.getElementById('hi').textContent = +(localStorage.getItem('nt-hi')||0);
  document.getElementById('startBtn').onclick=()=>{ hideOverlay(); if(G.gameOver) newGame(); else if(!G.running){ G.running=true; Audio.ensure(); Audio._start(); spawnPiece(); updateHud(); setStatus('PLAY'); } };
  document.getElementById('pauseBtn').onclick=pause;
  document.getElementById('soundBtn').onclick=function(){
    if(!Audio.ctx) Audio.ensure();
    Audio.muted=!Audio.muted;
    this.textContent=Audio.muted?'解除静音':'静音';
    this.classList.toggle('active',Audio.muted);
  };
  document.getElementById('helpBtn').onclick=()=>{
    const open=!document.getElementById('helpCard').classList.contains('hidden');
    hideOverlay();
    if(!open){ showHelp(); } else { hideOverlay(); }
  };
  document.getElementById('closeCard').onclick=hideOverlay;

  function buildControls(){
    const body=document.getElementById('ovBody'); body.innerHTML='';
    body.appendChild(btn('开始游戏','start','btn'));
    body.appendChild(keyHelp());
  }
  function keyHelp(){
    const d=document.createElement('div'); d.className='keys';
    d.innerHTML=`<b>操控</b><br><kbd>←</kbd><kbd>→</kbd> 移动 &nbsp; <kbd>↓</kbd> 软降<br><kbd>↑</kbd>/<kbd>Z</kbd>/<kbd>X</kbd> 旋转 &nbsp; <kbd>长按↓</kbd> 快速<br><kbd>Space</kbd> 硬降 &nbsp; <kbd>C</kbd>/<kbd>Shift</kbd> 持有<br><kbd>P</kbd> 暂停`;
    return d;
  }
  function btn(text,id,cls){ const b=document.createElement('button'); b.className=cls; b.textContent=text; b.setAttribute('data-act',id); b.onclick=()=>{
    if(id==='start') newGame(); else if(id==='resume') resume(); else if(id==='restart') newGame();
    hideOverlay();
  }; return b; }
  function showHelp(){
    hideOverlay();
    const card=document.getElementById('card');
    const body=document.getElementById('ovBody'); body.innerHTML='';
    const h=document.createElement('h1'); h.textContent='怎么玩';
    const p1=document.createElement('p'); p1.className='sub'; p1.textContent='现代俄罗斯方块的完整玩法指南：';
    const seg=document.createElement('div'); seg.className='seg'; seg.style.justifyContent='flex-start'; seg.style.margin='6px 0';
    seg.innerHTML=`<button data-gen="7bag" class="active">7-Bag (SRS)</button>
      <button data-gen="4bag">4-Bag</button><button data-gen="classic">Classic</button><button data-gen="9bag">Random9G</button>`;
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); G.gen=b.getAttribute('data-gen'); addQueue();
    });
    body.appendChild(h); body.appendChild(p1); body.appendChild(seg);
    body.appendChild(keyHelp());
    body.appendChild(p(document.createTextNode('• 每次消行 100/300/500/800 × 等级。'),'#cfe0ff'));
    body.appendChild(p(document.createTextNode('• 连击连续消行额外加分，中断后重置。'),'#cfe0ff'));
    body.appendChild(p(document.createTextNode('• T-Spin：T 方块在坑中落地，空角落越多奖励越高。'),'#6dff9b'));
    body.appendChild(p(document.createTextNode('• 完美清除：无空隙整列消除，额外加分。'),'#6dff9b'));
    const close=document.createElement('button'); close.className='btn'; close.textContent='明白了';
    close.onclick=()=>{ hideOverlay(); buildControls(); };
    body.appendChild(close);
    document.getElementById('overlay').classList.remove('hidden');
  }
  function showOverlay(title,text,controls){
    document.getElementById('ovTitle').textContent=title;
    document.getElementById('ovText').textContent=text||'';
    document.getElementById('card').querySelectorAll('button[data-act]').forEach(b=>b.remove());
    (controls||[]).forEach(c=>document.getElementById('ovBody').appendChild(c));
    document.getElementById('overlay').classList.remove('hidden');
    if(document.getElementById('closeCard')) document.getElementById('closeCard').classList.add('hidden');
  }
  function hideOverlay(){ document.getElementById('overlay').classList.add('hidden'); if(document.getElementById('closeCard')) document.getElementById('closeCard').classList.remove('hidden'); }
  function p(txt,cls){ const e=document.createElement('p'); e.style.cssText='color:'+cls||'#cfe0ff'; e.textContent=txt; return e; }

  // 设置控件
  const lockToggle=document.getElementById('lockToggle');
  function updateLock(){
    lockToggle.checked = G.lockDelay>0;
    document.getElementById('lockLabel').textContent = G.lockDelay>0?'0.5s':'0s 即时';
  }
  lockToggle.onchange=function(){
    G.lockDelay = this.checked?500:0; updateLock();
  };

  function fit(){
    const maxW = window.innerWidth - 60;
    const maxH = window.innerHeight - 60;
    const cw = CELL*W, ch = CELL*H;
    const scale = Math.min(maxW/cw, maxH/ch, 1.15);
    canvas.style.width=(cw*scale)+'px'; canvas.style.height=(ch*scale)+'px';
  }
  window.addEventListener('resize',fit);

  // ---------- 启动 ----------
  G.hi = +(localStorage.getItem('nt-hi')||0);
  updateLock();
  fit();
  addQueue();
  updateHud();
  requestAnimationFrame(loop);
  showOverlay('NEON TETRIS','现代俄罗斯方块：霓虹视觉、SRS 墙踢、7-bag 随机器、Hold、幽灵块、T-Spin 与程序化音效配乐，尽在其中。',buildControls());
})();
</script>
</body>
</html>
